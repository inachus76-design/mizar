function showImage(id, fallback, src, embedded) {
  if (!src) return;
  const image = byId(id);
  image.addEventListener('load', () => {
    image.hidden = false;
    image.style.display = 'block';
    byId(fallback).style.display = 'none';
  }, {once:true});
  image.addEventListener('error', () => { image.src = embedded; }, {once:true});
  image.src = src;
}

const audio = byId('audio'), play = byId('play'), seek = byId('seek'), status = byId('music-status');
audio.volume = Number(byId('volume').value);
const unavailable = () => {status.textContent = '음악 준비 중…'; play.disabled = true; seek.disabled = true;};
audio.addEventListener('error', unavailable);
if (audio.error) unavailable();
audio.addEventListener('loadedmetadata', () => { play.disabled = false; seek.disabled = !Number.isFinite(audio.duration); status.textContent = '재생 버튼을 눌러 주세요.'; });
function playbackChanged() {
  const playing = !audio.paused && !audio.ended;
  play.textContent = playing ? 'Ⅱ' : '▶';
  play.setAttribute('aria-label', playing ? '일시 정지' : '재생');
  byId('lp').classList.toggle('playing', playing);
  if (!audio.error) status.textContent = playing ? '재생 중' : '멈춤';
}
for (const event of ['play','pause','ended']) audio.addEventListener(event, playbackChanged);
play.addEventListener('click', async () => {
  if (!audio.paused) { audio.pause(); return; }
  try { await audio.play(); } catch { if (audio.error || !audio.currentSrc) unavailable(); else status.textContent = '음악을 재생할 수 없습니다.'; }
});
audio.addEventListener('timeupdate', () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) seek.value = audio.currentTime / audio.duration * 100;
});
seek.addEventListener('input', () => { if (Number.isFinite(audio.duration)) audio.currentTime = audio.duration * Number(seek.value) / 100; });
byId('volume').addEventListener('input', event => { audio.volume = Number(event.target.value); });

const form = byId('form'), note = byId('note'), entries = byId('entries');
const dayFormat = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'});
const localMode = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname) && location.port !== '8787';
const previewKey = 'mizar-minihome-v1';
function render(data) {
  byId('today').textContent = data.today;
  byId('total').textContent = data.total;
  entries.replaceChildren();
  for (const entry of data.entries.slice(0,20)) {
    const item = document.createElement('li'), name = document.createElement('strong'), time = document.createElement('time'), message = document.createElement('p');
    name.textContent = entry.name;
    time.dateTime = entry.createdAt;
    time.textContent = dayFormat.format(new Date(entry.createdAt));
    message.textContent = entry.message;
    item.append(name,time,message);
    entries.append(item);
  }
}
let preview = {today:0,total:0,day:'',entries:[]};
function previewUpdate(action, entry) {
  try { preview = JSON.parse(localStorage.getItem(previewKey)) || preview; } catch {}
  const day = dayFormat.format(new Date());
  if (preview.day !== day) { preview.day = day; preview.today = 0; }
  if (action === 'visit') { preview.today++; preview.total++; }
  if (action === 'entry') preview.entries = [{...entry,createdAt:new Date().toISOString()},...preview.entries];
  try { localStorage.setItem(previewKey, JSON.stringify(preview)); } catch {}
  return preview;
}
async function update(action, entry) {
  if (localMode) return previewUpdate(action,entry);
  const response = await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry ?? {})});
  if (!response.ok) throw new Error('Request failed');
  return response.json();
}
const ready = update('visit').then(render).catch(() => { note.textContent = '방명록을 불러오지 못했습니다. 페이지를 새로고침해 주세요.'; });
if (localMode) note.textContent = '미리보기 기록은 이 브라우저에 저장됩니다.';
form.addEventListener('submit', async event => {
  event.preventDefault();
  const name = form.elements.name.value.trim(), message = form.elements.message.value.trim();
  if (!name || !message) { note.textContent = '닉네임과 글을 입력해 주세요.'; return; }
  if (form.elements.name.value.length > 20 || form.elements.message.value.length > 200) {
    note.textContent = '닉네임은 20자, 글은 200자까지 입력할 수 있습니다.';
    return;
  }
  const button = form.querySelector('button');
  button.disabled = true;
  await ready;
  try { render(await update('entry',{name,message})); form.reset(); note.textContent = localMode ? '이 브라우저의 방명록에 등록했습니다.' : '방명록에 등록했습니다.'; }
  catch { note.textContent = '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
  finally { button.disabled = false; }
});
</script><script type="module" src="classroom.mjs"></script></body></html>
